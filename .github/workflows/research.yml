name: Refresh public research
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: public-research
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text reader
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - uses: actions/cache@v4
        with:
          path: cache
          key: public-research-${{ github.run_id }}
          restore-keys: public-research-
      - name: Refresh SEC and House sources
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/cloud-refresh.py
      - name: Save successful source snapshots
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/research
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public research snapshots'
            git push
          fi
