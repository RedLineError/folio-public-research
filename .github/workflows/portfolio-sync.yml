name: Save private portfolio history
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  actions: write
concurrency:
  group: folio-private-portfolio
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - name: Refresh and verify private cloud history
        env:
          FOLIO_SITE_TOKEN: ${{ secrets.FOLIO_SITE_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin='https://folio-paper-desk-damo.exo09432.chatgpt.site';
          const token=process.env.FOLIO_SITE_TOKEN;
          if(!token)throw Error('Private Site service credential is missing.');
          const headers={'OAI-Sites-Authorization':'Bearer '+token,'X-Folio-Sync':'1'};
          async function run(){
            const response=await fetch(origin+'/api/sync',{method:'POST',headers,redirect:'manual',signal:AbortSignal.timeout(60000)});
            if(!response.ok)throw Error('Private cloud sync HTTP '+response.status);
            const receipt=await response.json();
            const check=await fetch(origin+'/api/history',{headers,redirect:'manual',signal:AbortSignal.timeout(30000)});
            if(!check.ok)throw Error('Private history readback HTTP '+check.status);
            const history=await check.json();
            if(!receipt.ok||history.last_cloud_update<receipt.observed_at||history.background_stale)throw Error('Cloud history readback did not confirm this run.');
            console.log('Private cloud snapshot saved and read back successfully.');
            const scan=await fetch(origin+'/api/trials/scan',{method:'POST',headers,redirect:'manual',signal:AbortSignal.timeout(60000)});
            if(!scan.ok)throw Error('Strategy scan HTTP '+scan.status);
            const scanned=await scan.json();
            if(scanned.busy)throw Error('Strategy scan lock requires review.');
            if(!scanned.ok)throw Error('Strategy scan was not confirmed.');
            console.log('Private strategy scan saved successfully.');
          }
          const end=Date.now()+5*60*60*1000;
          let failures=0;
          while(Date.now()<end){
            const started=Date.now();
            try{await run();failures=0;console.log('Verified cloud cycle '+new Date().toISOString());}
            catch(error){failures++;console.error(error.message);if(failures>=3)throw Error('Three consecutive cloud cycles failed; review required.');}
            const ny=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
            const day=ny.find(p=>p.type==='weekday').value,hour=Number(ny.find(p=>p.type==='hour').value);
            const cadence=!['Sat','Sun'].includes(day)&&hour>=9&&hour<16?60000:300000;
            await new Promise(r=>setTimeout(r,Math.max(0,Math.min(end-Date.now(),cadence-(Date.now()-started)))));
          }
          NODE
      - name: Hand off to the next bounded cloud runner
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run portfolio-sync.yml --repo "${{ github.repository }}" --ref main
